apiVersion: v1
kind: ServiceAccount
metadata:
  name: orders-api
  namespace: default
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::111122223333:role/orders-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders-api
  template:
    metadata:
      labels:
        app: orders-api
    spec:
      serviceAccountName: orders-api
      containers:
      - name: orders-api
        image: acme/orders-api:1.4.0
        env:
        - name: LOG_LEVEL
          value: info
        - name: ORDERS_TABLE
          value: orders
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: orders-api
  namespace: default
spec:
  selector:
    app: orders-api
  ports:
  - port: 8080
    targetPort: 8080
